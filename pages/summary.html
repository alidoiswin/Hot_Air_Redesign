<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Summary</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Agbalumo&family=Roboto:ital,wght@0,100..900;1,100..900&family=Rubik+Bubbles&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles/main.css">
  <script src="../scripts/script.js" defer></script>
</head>

<body>

  <section class="summary-section">
    <h1 class="agbalumo-regular">Booking Summary</h1>
    <article class="summary-card roboto-regular">
      <h2>Trip Details</h2>

      <p>
      <strong>Place:</strong>
      <span>Melbourne</span>
      </p>
      <p>
        <strong>Date:</strong>
        <span id="summary-date"></span>
      </p>
      <p>
        <strong>Passengers:</strong>
        <span id="summary-passengers"></span>
      </p>
      <p>
        <strong>Time:</strong>
        <span id="summary-time"></span>
      </p>
      <p>
        <strong>Add-ons:</strong>
        <span id="summary-addons"></span>
      </p>
      <p class="summary-total">
        <strong>Total:</strong>
        <span id="summary-total"></span>
      </p>
    </article>

    <aside class="payment-sidebar roboto-regular">

    <h2 class="agbalumo-regular">Checkout</h2>

    <form class="payment-form">

      <label>Full Name</label>
      <input type="text" id="fullName">

      <label>Email</label>
      <input type="email" id="email">

      <label>Card Number</label>
      <input type="text" id="cardNumber">

      <div class="card-row">

        <div>
          <label>Expiry</label>
          <input type="text" id="expiry">
        </div>

        <div>
          <label>CVC</label>
          <input type="text" id="cvc">
        </div>

      </div>

      <button class="summary-btn">
        Confirm Payment
      </button>

    </form>

  </aside>


  </section>

</body>
</html>
